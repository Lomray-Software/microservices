name: Check PR

on:
  pull_request:
    branches: [ prod, staging ]
    types: [ opened, synchronize ]

jobs:
  changed-microservices:
    name: Get changed microservices
    runs-on: ubuntu-latest
    outputs:
      microservices: ${{ steps.microservices.outputs.list }}
      has-services: ${{ steps.microservices.outputs.has-services }}
      tested-sha: ${{ steps.microservices.outputs.tested-sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test service selection
        run: node --test .github/scripts/service-matrix.test.cjs

      - id: microservices
        run: node .github/scripts/service-matrix.cjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ github.sha }}

  prtitle:
    name: Check PR title
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Commit lint
        run: |
          npm install commitlint@18.6.0 @commitlint/config-conventional@18.5.0
          echo "${{ github.event.pull_request.title }}" | npx --no-install commitlint -g commitlint.config.js

  checks:
    name: Run code checks
    needs: changed-microservices
    runs-on: ubuntu-latest
    if: needs.changed-microservices.outputs.has-services == 'true'

    strategy:
      fail-fast: false
      matrix:
        microservice: ${{ fromJson(needs.changed-microservices.outputs.microservices) }}

    env:
      MICROSERVICE_NAME: ${{ matrix.microservice }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changed-microservices.outputs.tested-sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Show toolchain
        run: node --version && npm --version

      - run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc

      - name: Install global dependencies
        run: npm ci

      - name: Install microservice dependencies
        run: npm install
        working-directory: microservices/${{ matrix.microservice }}

      - name: Record installed test loader paths
        run: |
          node -e "for (const name of ['mocha', 'ts-node', 'rewiremock', 'typescript', '@lomray/microservice-config']) console.log(name, require.resolve(name + '/package.json'))"
        working-directory: microservices/${{ matrix.microservice }}

      - name: Test loader differential validator
        if: matrix.microservice == 'blog'
        run: node --test .github/scripts/test-loader-differential.test.cjs

      - name: Characterize Node22 native and ts-node loaders
        if: matrix.microservice == 'blog'
        run: node .github/scripts/test-loader-differential.cjs
        env:
          TESTED_SHA: ${{ needs.changed-microservices.outputs.tested-sha }}

      - name: Check microservice eslint
        run: npm run lint:check
        working-directory: microservices/${{ matrix.microservice }}

      - name: Check microservice typescript
        run: npm run ts:check
        working-directory: microservices/${{ matrix.microservice }}

      - name: Check TypeScript test loader
        run: node --test .github/scripts/test-loader.test.cjs
        env:
          NODE_OPTIONS: --no-experimental-strip-types

      - name: Run microservices tests
        env:
          NODE_OPTIONS: --no-experimental-strip-types
        run: npm run test
        working-directory: microservices/${{ matrix.microservice }}

  sonarcube:
    name: Sonarcube
    needs: [changed-microservices]
    if: needs.changed-microservices.outputs.has-services == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-sonarcube-${{ matrix.microservice }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        microservice: ${{ fromJson(needs.changed-microservices.outputs.microservices) }}

    env:
      MICROSERVICE_NAME: ${{ matrix.microservice }}
      WORK_DIR: "microservices/${{ matrix.microservice }}"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changed-microservices.outputs.tested-sha }}
          fetch-depth: 0

      - uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_CLOUD_TOKEN }}
        with:
          projectBaseDir: ${{ env.WORK_DIR }}
